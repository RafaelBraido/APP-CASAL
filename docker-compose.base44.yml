# Base44 dev environment — runs the app from the cloned source with live reload.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo_data:/data/db

  app:
    image: node:22-slim
    working_dir: /app/BACK
    # Bind-mount the cloned source so edits are reflected live.
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/facilitatech
      - JWT_SECRET=base44-dev-jwt-secret-change-me
      - JWT_EXPIRES_IN=1d
      - ADMIN_CODE=1234
    depends_on:
      mongo:
        condition: service_healthy
    # Install deps on boot, then run with Node's built-in file watcher for live reload.
    command: sh -c "npm install && node --watch server.js"

volumes:
  mongo_data:
