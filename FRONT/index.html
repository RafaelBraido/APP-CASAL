<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Flutuante Liquid Glass</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0f1115; 
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            color: #ffffff;
        }

        /* Botão Hambúrguer Fixado no Topo */
        .menu-toggle {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 28px;         
            height: 20px;        
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        .menu-toggle span {
            width: 100%;
            height: 3px;
            background-color: #ffffff; 
            border-radius: 2px;
        }

        /* CAIXINHA FLUTUANTE (Menu Lateral/Gaveta) */
        .menu-drawer {
            position: fixed;
            top: 55px; /* Aparece logo abaixo do botão hambúrguer */
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px; /* Espaço confortável entre os botões */
            padding: 18px;
            
            /* Visual de Caixinha Flutuante */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

            /* Animação de Abrir/Fechar */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 999;
        }

        /* Estado Aberto do Menu */
        .menu-drawer.aberto {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Botão Liquid Glass */
        .liquid-btn {
            position: relative;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            display: inline-block;
            border: none;
            cursor: pointer;
            border-radius: 46px;
            text-align: left;
            white-space: nowrap;
            
            /* Estilo Liquid Glass */
            background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 45%, rgba(255,255,255,0.2) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        /* Hover nos Botões */
        .liquid-btn:hover {
            background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.25) 45%, rgba(255,255,255,0.4) 100%);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Botão Hambúrguer -->
    <button class="menu-toggle" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Caixinha Flutuante com os Botões -->
    <div class="menu-drawer" id="menuItem">
        <a href="#" class="liquid-btn">Início</a>
        <a href="#" class="liquid-btn">Orange Glass</a>
        <a href="#" class="liquid-btn">Teste de Personalidade</a>
        <a href="#" class="liquid-btn">Projetos</a>
        <a href="#" class="liquid-btn">Contato</a>
    </div>

    <script>
        function toggleMenu() {
            var menu = document.getElementById("menuItem");
            menu.classList.toggle("aberto");
        }
    </script>

</body>
</html>
